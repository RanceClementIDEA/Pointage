## 5. Planifier l'exécution quotidienne

### Mac / Linux

```bash
crontab -e
```

```
0 8 * * * cd /chemin/absolu/vers/price_tracker && /usr/bin/python3 price_tracker.py >> log.txt 2>&1
```

### Windows

Planificateur de tâches → Créer une tâche de base → quotidien →
« Démarrer un programme » :
- Programme : `python.exe` (chemin complet)
- Arguments : `price_tracker.py`
- Démarrer dans : le dossier `price_tracker`

### Si vous ne voulez pas laisser une machine allumée

Les tâches planifiées de Claude Cowork tournent sur le cloud (PC éteint
possible) — ce n'est pas ce script exact, mais Claude peut faire une
recherche de prix quotidienne et vous envoyer un récapitulatif.

