## 6. Comment l'améliorer

Classé par rapport valeur/effort.

### Rapide et rentable

1. **Enrichir l'historique** avec `--add-price` dès que vous voyez un prix
   ailleurs. C'est de loin ce qui améliore le plus les conseils.
2. **Ajouter des sources** par composant : plus il y a de revendeurs
   comparés, plus l'intelligence par site devient fiable (le rapport vous
   dit qui est le moins cher le plus souvent).
3. **Ajuster les seuils** après 2-3 semaines : si tout est marqué « bonne
   affaire », baissez `deal_percent` à 2 ou 1.
4. **Suivre les alternatives**, pas seulement votre choix : ajoutez la
   RTX 5060 Ti à côté de la RX 9060 XT et laissez le prix décider.

### Moyen terme

5. **Notification instantanée** sur grosse baisse : ajoutez un envoi
   Telegram (bibliothèque `python-telegram-bot`) déclenché uniquement si un
   composant passe sous son plus bas historique — l'email quotidien ne suffit
   pas pour les ventes flash.
6. **Surveiller la disponibilité** en plus du prix : un produit « en stock à
   429 € » vaut mieux qu'un « rupture à 399 € ».
7. **Graphique de tendance** dans l'email : matplotlib peut générer un PNG
   d'évolution à joindre au message.
8. **Flux RSS Dealabs** : Dealabs expose des flux RSS par mot-clé, qu'on peut
   parser sans scraper de HTML — plus stable et dans les règles.

### Plus ambitieux

9. **Prédiction de prix** : avec 3-6 mois d'historique, un modèle simple
   (régression, moyenne mobile) peut estimer si la baisse va continuer.
   Attention à ne pas surinterpréter : le marché du GPU dépend surtout
   d'annonces produit, pas de cycles réguliers.
10. **APIs officielles** plutôt que scraping : Amazon Product Advertising API,
    ou les flux affiliés de Rakuten/Cdiscount. Plus stable et parfaitement
    légal, mais demande une inscription au programme d'affiliation.

---

## 7. Limites à connaître

- **Le scraping est fragile et hors CGU.** Le script privilégie l'extraction
  via données structurées JSON-LD (plus stable que les sélecteurs CSS), mais
  un site qui change sa structure peut casser l'extraction. En usage
  personnel à 1 requête/jour le risque est faible ; ne l'utilisez pas de
  façon intensive ou commerciale.
- **Les conseils sont des heuristiques**, pas des prédictions. Ils décrivent
  où se situe un prix par rapport à son historique connu — ce qui est déjà
  très utile — mais ne prévoient pas l'avenir.
- **Les baisses annoncées par période promo sont des ordres de grandeur**
  observés les années précédentes, pas des garanties.
- **Vérifiez toujours avant de payer** : prix, disponibilité réelle, frais de
  port, et le fait que le vendeur soit bien le marchand principal et non un
  vendeur tiers inconnu sur une marketplace.

