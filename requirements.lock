## 4. Comment lire le rapport

### Les 5 conseils possibles

| Conseil | Signification | Action |
|---|---|---|
| **ACHETER** | Au plus bas connu ou à moins de 3% | Commandez, c'est le moment |
| **ATTENDRE** | Au-dessus du prix habituel, ou baisse en cours, ou grosse promo imminente | Laissez passer quelques jours/semaines |
| **CORRECT** | Prix raisonnable sans être exceptionnel | Achetez si vous êtes pressé |
| **NEUTRE** | Rien à signaler | Continuez à observer |
| **A VERIFIER** | Le prix vient de l'historique importé, pas d'un relevé récent | Vérifiez sur le site avant de commander |

Ce dernier point est important pour la cohérence : le script ne vous dira
jamais « achetez » sur la base d'un prix vieux de 47 jours qu'il n'a pas
lui-même vérifié.

### Le score /100

Combine la position du prix dans sa fourchette historique connue (60%), sa
proximité avec le plus bas (30%) et sa tendance (10%). 100 = au plus bas
jamais vu. Si la fourchette connue est trop étroite (moins de 5% d'écart),
le score reste neutre à 50 plutôt que de produire un chiffre trompeur sur un
échantillon trop plat.

### La stratégie du jour

- **ACHETER MAINTENANT** — ≥60% des composants bien positionnés
- **ACHAT ECHELONNE** — prenez les composants au plus bas, laissez venir les
  autres. Rappel utile : le matériel PC ne se périme pas, acheter en
  plusieurs fois est parfaitement viable et souvent plus économique.
- **PATIENTER** — ≥50% des composants sont chers en ce moment
- **OBSERVER** — pas de signal clair

