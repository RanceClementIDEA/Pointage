## 3. Configuration

### 3.1 Les URLs (à faire en premier)

Dans `config.json`, certaines URLs sont des placeholders
(`REMPLACEZ_PAR_ASIN_REEL`). Le script les détecte et les ignore proprement,
mais remplacez-les par les vraies fiches produit pour que le suivi
fonctionne. Les URLs LDLC et Cdiscount sont déjà réelles.

### 3.2 L'historique préexistant — le point clé

Deux mécanismes complémentaires :

**`reference`** — les repères que vous connaissez sur un produit :

```json
"reference": {
  "msrp": 499,              // prix catalogue / lancement
  "historical_low": 349.00, // le plus bas jamais vu (même si c'était avant le suivi)
  "typical_price": 429,     // le prix "normal" constaté
  "note": "Plus bas 349 EUR (Sapphire Pulse, nov. 2025)."
}
```

**`seed_history`** — des relevés datés précis :

```json
"seed_history": [
  { "date": "2025-11-20", "site": "divers",    "price": 349.00 },
  { "date": "2026-05-15", "site": "divers",    "price": 419.00 },
  { "date": "2026-07-23", "site": "alternate", "price": 429.00 }
]
```

Ces données sont importées une seule fois, au premier lancement (relancez
avec `--reset-seed` si vous les modifiez).

**Où trouver ces historiques ?**
- **idealo.fr** affiche une courbe de prix sur 12 mois pour la plupart des
  produits — la source la plus simple et la plus fiable.
- **Dealabs** : cherchez le produit, les anciens deals donnent les meilleurs
  prix historiques avec leurs dates.
- **camelcamelcamel.com** pour tout ce qui est vendu sur Amazon.
- Vos propres captures d'écran / paniers abandonnés.

Prenez 15 minutes pour remplir ça sérieusement sur vos 3-4 composants les
plus chers : c'est ce qui fait la différence entre un outil qui devine et un
outil qui sait.

### 3.3 Budget et seuils

```json
"budget": { "target_total": 1000, "max_total": 1150 },
"thresholds": {
  "deal_percent": 3,          // "bonne affaire" si à ≤3% du plus bas connu
  "strong_deal_percent": 1,   // "au plus bas" si à ≤1%
  "wait_percent": 10          // "attendre" si ≥10% au-dessus du prix habituel
}
```

### 3.4 Contexte marché

Permet d'inverser un conseil selon la dynamique d'une catégorie :

```json
"market_context": {
  "RAM": { "trend": "hausse", "note": "Pénurie DDR4/DDR5..." }
}
```

Sur une catégorie en **hausse**, un « ATTENDRE » devient « CORRECT »
(attendre coûterait plus cher). Sur une catégorie en **baisse**, un
« CORRECT » devient « ATTENDRE ». Mettez ces valeurs à jour 1 à 2 fois par
an, ou quand vous lisez une actu marché marquante.

### 3.5 Email

Remplissez la section `email` de `config.json`, puis créez `.env` à partir
de `.env.example` avec un **mot de passe d'application** Gmail (voir les
instructions détaillées dans ce fichier). N'utilisez jamais votre mot de
passe de compte principal.

