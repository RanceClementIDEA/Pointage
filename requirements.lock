# PC Price Tracker — v2

Suivi quotidien du prix de vos composants PC, avec historique, score
d'affaire, calendrier des promos françaises et **plan d'achat** envoyé par
email chaque matin.

La nouveauté principale de la v2 : le script **importe un historique de prix
préexistant** (relevés faits avant l'installation du suivi). Sans ça, le
premier jour, tout est mécaniquement marqué « au plus bas » faute de recul,
et les conseils ne servent à rien pendant deux semaines.

---

## 1. Installation

### Sans rien installer : GitHub Actions

Le script tourne sur les serveurs de GitHub, gratuitement, et vous envoie le
rapport chaque jour. Rien sur votre machine — la bonne option si vous êtes
sur un poste de travail verrouillé. Voir **`GITHUB_ACTIONS.md`**.

### En local : le lanceur

| Système | Action |
|---|---|
| Windows | Double-cliquez sur `lancer.bat` |
| Mac | Double-cliquez sur `lancer.command` |
| Linux | `chmod +x lancer.sh` puis `./lancer.sh` |

Un menu s'ouvre, les dépendances s'installent toutes seules, et tout se fait
sans commande à retenir (email, planification quotidienne incluses).
Voir `DEMARRAGE_RAPIDE.md`.

### En ligne de commande (si vous préférez)

```bash
pip install -r requirements.txt
python price_tracker.py --report-only --no-email
```

Vous verrez déjà un rapport, construit à partir de l'historique pré-rempli
dans `config.json` (prix réels relevés lors de nos recherches).

---

## 2. Les commandes (équivalents du menu)

| Commande | Ce qu'elle fait |
|---|---|
| `python price_tracker.py` | Vérifie les prix + envoie l'email. **C'est la commande à planifier.** |
| `python price_tracker.py --no-email` | Pareil, mais affiche le rapport dans le terminal |
| `python price_tracker.py --dry-run --no-email` | Prix simulés, aucune requête réseau — pour tester |
| `python price_tracker.py --report-only` | Rapport depuis l'historique, sans interroger les sites |
| `python price_tracker.py --history cpu_5700x` | Affiche tout l'historique d'un composant |

Plus une commande très utile au quotidien :

```bash
# Vous voyez un bon prix sur Dealabs, un forum, en magasin ?
python price_tracker.py --add-price gpu_rx9060xt 389.90 dealabs

# Avec une date précise (pour enrichir l'historique passé) :
python price_tracker.py --add-price cpu_5700x 129.99 amazon --date 2026-07-15
```

Chaque prix saisi manuellement enrichit l'historique et améliore la
pertinence des conseils. **C'est le meilleur moyen de rendre l'outil
intelligent rapidement.**

