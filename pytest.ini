#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
publier_dashboard.py -- publication OPTIONNELLE du tableau de bord.

Rien n'est publie sans un geste explicite. Ce script refuse de s'executer
tant que `publication_dashboard` n'a pas ete mis a `true` dans config.json.

Ce qu'il publie : UN SEUL FICHIER, dashboard.html.
Ce qu'il ne publie JAMAIS : config.json, prices.db, history.json, .env,
les snapshots, ni quoi que ce soit d'autre. Le dossier de publication est
reconstruit a vide a chaque fois, et un seul fichier y est copie -- il n'y a
donc rien a oublier d'exclure.

Ecueil de la v2.6, evite ici
----------------------------
GitHub Pages n'est pas disponible gratuitement sur un depot PRIVE. La
tentation serait de rendre public le depot du suivi -- ce qui exposerait
config.json, l'historique complet et, sur un depot mal configure, les
secrets. La publication vise donc un SECOND depot, public, dedie a ce seul
usage, et le script refuse de publier vers le depot courant.

Trois garde-fous actifs (pas seulement documentes)
--------------------------------------------------
  1. desactive par defaut ;
  2. refus si la cible est le depot courant ;
  3. analyse du fichier avant envoi : adresses email, identifiants SMTP,
     jetons... Un motif suspect interrompt la publication.

Usage :
    python publier_dashboard.py --verifier     # controle sans rien publier
    python publier_dashboard.py                # publie (si autorise)
    python publier_dashboard.py --dossier ./public   # prepare pour Cloudflare
"""
import argparse
import json
import re
import shutil
import subprocess
import sys
import tempfile
from datetime import datetime
from pathlib import Path

BASE_DIR = Path(__file__).resolve().parent
FICHIER = BASE_DIR / "dashboard.html"

# Ce qui ne doit JAMAIS se retrouver dans un fichier publie. La liste vise
# des traces concretes de configuration, pas des mots courants : un faux
# positif bloquerait la publication pour rien.
MOTIFS_SENSIBLES = [
    (r"[\w.+-]+@[\w-]+\.[\w.]{2,}", "adresse email"),
    (r"smtp[._-]?(server|host|password|port)", "parametre SMTP"),
    (r"(app_?password|mot_?de_?passe|api[._-]?key|secret|token)\s*[:=]",
     "identifiant ou jeton"),
    (r"gh[pousr]_[A-Za-z0-9]{16,}", "jeton GitHub"),
    (r"ntfy\.sh/\S+", "canal de notification"),
]


def charger_config():
    chemin = BASE_DIR / "config.json"
    if not chemin.exists():
        sys.exit("config.json introuvable.")
    return json.loads(chemin.read_text(encoding="utf-8"))


def reglages(config):
    """Section `publication` de config.json, avec ses defauts prudents."""
    p = config.get("publication") or {}
    return {
        "actif": bool(config.get("publication_dashboard", p.get("actif", False))),
        "depot": p.get("depot"),              # ex. git@github.com:moi/mon-dashboard.git
        "branche": p.get("branche", "main"),
        "anonymiser": bool(p.get("anonymiser", False)),
    }


# ---------------------------------------------------------------------------
# Garde-fous
# ---------------------------------------------------------------------------

def depot_courant():
    try:
        r = subprocess.run(["git", "remote", "get-url", "origin"],
                           cwd=BASE_DIR, capture_output=True, text=True)
        return r.stdout.strip() if r.returncode == 0 else ""
    except Exception:
        return ""


def _normaliser_depot(url):
    """Ramene git@github.com:a/b.git et https://github.com/a/b a « a/b »."""
    if not url:
        return ""
    u = url.strip().rstrip("/")
    u = re.sub(r"\.git$", "", u)
    u = re.sub(r"^git@[^:]+:", "", u)
    u = re.sub(r"^https?://[^/]+/", "", u)
    return u.lower()


def controler(config, cible=None):
    """
    Verifie que la publication est permise et sans danger.
    Retourne (autorise, [messages]).
    """
    r = reglages(config)
    messages, autorise = [], True

    if not r["actif"]:
        return False, ["publication desactivee (publication_dashboard = false) "
                       "-- c'est le defaut, et rien ne sera publie"]

    if not FICHIER.exists():
        return False, ["dashboard.html absent : lancez d'abord python dashboard.py"]

    depot = cible or r["depot"]
    if not depot:
        return False, ["aucun depot de publication configure "
                       "(publication.depot dans config.json)"]

    courant = depot_courant()
    if courant and _normaliser_depot(depot) == _normaliser_depot(courant):
        return False, [
            "REFUS : la cible est le depot COURANT. Publier ici exposerait "
            "config.json, l'historique et vos secrets. Utilisez un second "
            "depot, public, dedie au seul dashboard."]

    # --- Analyse du contenu ---
    contenu = FICHIER.read_text(encoding="utf-8", errors="replace")
    trouves = []
    for motif, libelle in MOTIFS_SENSIBLES:
        for m in re.finditer(motif, contenu, re.I):
            extrait = m.group(0)[:60]
            trouves.append(f"{libelle} : {extrait}")
    if trouves:
        autorise = False
        messages.append(f"REFUS : {len(trouves)} element(s) sensible(s) dans le "
                        f"fichier a publier :")
        messages += [f"    - {t}" for t in trouves[:8]]

    return autorise, messages


# ---------------------------------------------------------------------------
# Anonymisation (facultative)
# ---------------------------------------------------------------------------

def anonymiser(contenu):
    """
    Retire du fichier ce qui identifie le projet : nom du projet, budgets.

    Les prix et les composants restent -- sans eux le dashboard n'a plus
    d'objet. C'est un attenuateur, pas une garantie d'anonymat.
    """
    sortie = contenu
    try:
        m = re.search(r'id="donnees-suivi">(.*?)</script>', sortie, re.S)
        if m:
            d = json.loads(m.group(1).replace("<\\/", "</"))
            for i, p in enumerate(d.get("projets", []), start=1):
                p["nom"] = f"Projet {i}"
            remplace = json.dumps(d, ensure_ascii=False,
                                  separators=(",", ":")).replace("</", "<\\/")
            sortie = sortie[:m.start(1)] + remplace + sortie[m.end(1):]
    except Exception:
        pass

    # Budgets : montants d'objectif et de plafond retires du bandeau.
    sortie = re.sub(r"sous l'objectif de [\d.,]+ EUR", "sous l'objectif", sortie)
    sortie = re.sub(r"au-dessus de l'objectif \([\d.,]+ EUR\)",
                    "au-dessus de l'objectif", sortie)
    return sortie


# ---------------------------------------------------------------------------
# Publication
# ---------------------------------------------------------------------------

def preparer(dossier, config):
    """
    Construit le dossier a publier : UN SEUL fichier.

    Le dossier est vide au depart, et on n'y copie que dashboard.html. Il n'y
    a donc rien a « oublier d'exclure » : ce qui n'est pas copie n'existe pas.
    """
    dossier = Path(dossier)
    if dossier.exists():
        shutil.rmtree(dossier)
    dossier.mkdir(parents=True)

    contenu = FICHIER.read_text(encoding="utf-8")
    if reglages(config)["anonymiser"]:
        contenu = anonymiser(contenu)

    (dossier / "index.html").write_text(contenu, encoding="utf-8")
    # Empeche l'indexation par les moteurs : l'URL reste consultable par qui
    # la connait, mais elle ne se retrouvera pas dans les resultats de
    # recherche. Ce n'est pas une protection, c'est une precaution.
    (dossier / "robots.txt").write_text(
        "User-agent: *\nDisallow: /\n", encoding="utf-8")
    return dossier


def publier_git(dossier, depot, branche):
    """Pousse le dossier prepare vers le depot public dedie."""
    with tempfile.TemporaryDirectory() as tmp:
        travail = Path(tmp) / "publication"
        subprocess.run(["git", "init", "-q", str(travail)], check=True)
        for f in Path(dossier).iterdir():
            shutil.copy2(f, travail / f.name)
        cmds = [
            ["git", "add", "-A"],
            ["git", "-c", "user.name=dashboard",
             "-c", "user.email=dashboard@local",
             "commit", "-q", "-m",
             f"Dashboard du {datetime.now().strftime('%d/%m/%Y')}"],
            ["git", "branch", "-M", branche],
            ["git", "remote", "add", "origin", depot],
            ["git", "push", "-f", "-q", "origin", branche],
        ]
        for c in cmds:
            r = subprocess.run(c, cwd=travail, capture_output=True, text=True)
            if r.returncode != 0:
                return False, (r.stderr or r.stdout).strip()[:300]
    return True, "publie"


def main():
    p = argparse.ArgumentParser(description="Publication optionnelle du dashboard")
    p.add_argument("--verifier", action="store_true",
                   help="Controle les garde-fous sans rien publier")
    p.add_argument("--dossier", metavar="CHEMIN",
                   help="Prepare le dossier sans pousser (Cloudflare Pages, etc.)")
    p.add_argument("--depot", metavar="URL",
                   help="Depot cible (sinon publication.depot du config)")
    args = p.parse_args()

    config = charger_config()
    r = reglages(config)

    print("=" * 70)
    print("  PUBLICATION DU TABLEAU DE BORD")
    print("=" * 70)
    print(f"  activee      : {'oui' if r['actif'] else 'NON (defaut)'}")
    print(f"  depot cible  : {args.depot or r['depot'] or '(aucun)'}")
    print(f"  anonymisation: {'oui' if r['anonymiser'] else 'non'}")
    print()

    autorise, messages = controler(config, args.depot)
    for m in messages:
        print(f"  {m}")

    if not autorise:
        print("\n  >>> RIEN N'A ETE PUBLIE.")
        return 1

    print("  Controles passes : aucun element sensible detecte.")
    if args.verifier:
        print("\n  >>> Mode verification : rien n'a ete publie.")
        return 0

    if args.dossier:
        dossier = preparer(args.dossier, config)
        print(f"\n  Dossier pret : {dossier} (index.html + robots.txt)")
        print("  Deployez-le sur Cloudflare Pages, Netlify ou equivalent.")
        print("  >>> Rien n'a ete pousse : le deploiement reste votre geste.")
        return 0

    depot = args.depot or r["depot"]
    with tempfile.TemporaryDirectory() as tmp:
        dossier = preparer(Path(tmp) / "site", config)
        ok, detail = publier_git(dossier, depot, r["branche"])

    if ok:
        print(f"\n  >>> Publie sur {depot} (branche {r['branche']}).")
        print("  Activez GitHub Pages sur CE depot pour obtenir l'URL.")
        print("  Rappel : les donnees du dashboard sont desormais PUBLIQUES.")
        return 0
    print(f"\n  Echec de la publication : {detail}")
    return 1


if __name__ == "__main__":
    sys.exit(main())
